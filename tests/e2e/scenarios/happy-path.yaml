name: "Complete standup flow — single member"
description: "Member receives DM, answers all questions, summary posts to channel"

setup:
  config:
    name: morning
    channel: "#standup"
    schedule:
      hour: 9
      minute: 0
      days: [1, 2, 3, 4, 5]
      timezone: UTC
    timeout_minutes: 60
    questions:
      - "What did you do yesterday?"
      - "What will you do today?"
      - "Any blockers?"
  members:
    - id: "U001"
      display_name: "Alice"

steps:
  - action: trigger_cron
    clock: "2025-01-06T09:00:00Z"

  - action: assert_dm_sent
    to: "U001"
    contains: "What did you do yesterday?"

  - action: user_replies
    from: "U001"
    text: "Finished the auth module"

  - action: assert_dm_sent
    to: "U001"
    contains: "What will you do today?"

  - action: user_replies
    from: "U001"
    text: "Starting the API integration"

  - action: assert_dm_sent
    to: "U001"
    contains: "Any blockers?"

  - action: user_replies
    from: "U001"
    text: "None"

  - action: assert_channel_post
    channel: "#standup"
    contains:
      - "U001"
      - "Finished the auth module"
      - "Starting the API integration"
      - "None"
