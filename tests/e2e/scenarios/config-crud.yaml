name: "Config CRUD operations"
description: "Create config, add questions, add members, schedule, activate, then trigger"

setup:
  config:
    name: test-standup
    channel: "#test"
    schedule:
      hour: 9
      minute: 0
      days: [1, 2, 3, 4, 5]
      timezone: UTC
    timeout_minutes: 45
    questions:
      - "Question one?"
      - "Question two?"
  members:
    - id: "U001"
      display_name: "Alice"

steps:
  - action: trigger_cron
    clock: "2025-01-06T09:00:00Z"

  - action: assert_dm_sent
    to: "U001"
    contains: "Question one?"

  - action: user_replies
    from: "U001"
    text: "Answer one"

  - action: assert_dm_sent
    to: "U001"
    contains: "Question two?"

  - action: user_replies
    from: "U001"
    text: "Answer two"

  - action: assert_channel_post
    channel: "#test"
    contains:
      - "Answer one"
      - "Answer two"
