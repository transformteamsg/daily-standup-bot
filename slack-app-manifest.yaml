display_information:
  name: Standup Bot
  description: Async standup collection via DMs with channel summaries

features:
  bot_user:
    display_name: Standup Bot
    always_online: true
  slash_commands:
    - command: /standup
      description: Manage standups
      usage_hint: "[create|list|show|schedule|help] ..."
      should_escape: false

oauth_config:
  scopes:
    bot:
      - chat:write
      - commands
      - im:write
      - im:read
      - im:history
      - users:read
      - channels:read

settings:
  event_subscriptions:
    bot_events:
      - message.im
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
