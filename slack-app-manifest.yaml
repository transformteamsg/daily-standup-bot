display_information:
  name: TFX Standup Bot
  description: Async standup collection via DMs with channel summaries

features:
  bot_user:
    display_name: TFX Standup Bot
    always_online: true
  slash_commands:
    - command: /tfx-standup
      description: Manage standups
      usage_hint: "[create|list|show|schedule|help] ..."
      should_escape: true
      url: https://YOUR_API_GATEWAY_URL/slack/events

oauth_config:
  scopes:
    bot:
      - chat:write
      - commands
      - im:write
      - im:read
      - im:history
      - users:read
      - channels:read
      - groups:read

settings:
  event_subscriptions:
    request_url: https://YOUR_API_GATEWAY_URL/slack/events
    bot_events:
      - message.im
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
